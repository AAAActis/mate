<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mate</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside id="zona-1" class="sidebar">
    <!-- SVG pequeño del matecito con tres destellos -->
    <svg width="40" height="40" viewBox="0 0 40 40" style="margin: 16px auto;">
      <circle cx="20" cy="20" r="18" fill="#8c5832" />
      <rect x="12" y="12" width="6" height="10" fill="#d6d9d8" />
      <line x1="20" y1="12" x2="20" y2="6" stroke="#d6d9d8" stroke-width="2" />
    </svg>
    <h1>Mate</h1>
    <p>Tu asistente, siempre con vos</p>
    <!-- Subrayado curvo SVG inline -->
    <svg width="100" height="8" viewBox="0 0 100 8" style="margin: 8px 0; display: block;">
      <path d="M0,8 C20,0 80,0 100,8" stroke="#8c5832" stroke-width="2" fill="none" />
    </svg>
    <button id="btn-nueva">+ Nueva conversación</button>
    <button id="btn-borrar">🗑 Borrar sesión</button>
    <section>
      <h2>Rutinas y conversaciones</h2>
      <button class="rutina" data-prompt="armar un plan de estudio">💬 Plan de estudio para examen</button>
      <button class="rutina" data-prompt="crear una rutina de gym">💬 Rutina de entrenamiento (Gym)</button>
      <button class="rutina" data-prompt="listar recordatorios y cumpleaños">💬 Recordatorios y cumpleaños</button>
      <button class="rutina" data-action="memoria">💬 Memoria de Mate (0/30 datos)</button>
    </section>
    <div id="resumen-agenda">
      <p>Tu agenda</p>
      <p>0 eventos hoy</p>
    </div>
    <div style="display: flex; justify-content: center; gap: 16px; margin: 16px 0;">
      <span style="width: 32px; height: 32px; border-radius: 50%; background: #e2e6ce; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #8c5832;">S</span>
      <span>Santiago</span>
    </div>
    <div style="display: flex; gap: 8px;">
      <button class="tono" data-tono="amable">🧉 Tono Amable</button>
      <button class="tono" data-tono="firme">🔥 Tono Firme</button>
    </div>
  </aside>

  <header id="zona-2" class="topbar">
    <!-- Topbar: puntito verde Mate en línea, contador de cuota, botón sol/luna, panel ⚙ -->
  </header>

  <main id="zona-3" class="stage">
    <!-- Escenario central: personaje Mate con globo de diálogo -->
  </main>

  <aside id="zona-4" class="agenda">
    <!-- Tarjeta "Tu agenda": navegador de mes, lista de próximos eventos -->
  </aside>

  <section id="zona-5" class="actions">
    <!-- 4 tarjetas horizontales + barra de chat inferior -->
  </section>

  <script src="/static/app.js" defer></script>
</body>
</html>
