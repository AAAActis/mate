<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mate</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Barra superior solo en mobile (< 900px) -->
  <header class="mobile-bar">
    <span class="logo-mini">Mate</span>
    <button id="btn-menu" class="icon-btn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
      <svg class="icon" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
    </button>
  </header>
  <div id="backdrop" class="backdrop" hidden></div>

  <aside id="sidebar" class="sidebar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <h1 class="brand-title">Mate</h1>
        <p class="brand-sub">Tu asistente, siempre con vos</p>
      </div>
    </div>

    <button id="btn-nueva" class="btn btn-primary">
      <svg class="icon" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
      Nueva conversación
    </button>

    <section class="side-section">
      <h2 class="side-title">Probá pedirle</h2>
      <button class="ejemplo" data-prompt="Redactame un mail para pedirle a mi profe una prórroga">Redactame un mail para mi profe</button>
      <button class="ejemplo" data-prompt="¿Qué me pongo para una entrevista de trabajo informal?">¿Qué me pongo para una entrevista?</button>
      <button class="ejemplo" data-prompt="Explicame qué es una clave foránea con un ejemplo">Explicame una clave foránea</button>
      <button class="ejemplo" data-prompt="Motivame para ir al gym hoy">Motivame para ir al gym</button>
    </section>

    <section class="side-section">
      <h2 class="side-title">Tu agenda</h2>
      <p id="resumen-agenda" class="side-text">Cargando…</p>
    </section>

    <footer class="side-foot">
      <div class="perfil">
        <span id="perfil-inicial" class="avatar" aria-hidden="true">·</span>
        <span id="perfil-nombre">Vos</span>
      </div>
      <div class="tonos" role="group" aria-label="Tono de Mate">
        <button class="tono" data-tono="amable" aria-pressed="true">Amable</button>
        <button class="tono" data-tono="firme" aria-pressed="false">Firme</button>
      </div>
    </footer>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="estado-conexion">
        <span id="puntito-conexion" class="puntito"></span>
        <span id="texto-conexion">Conectando…</span>
      </div>
      <div class="topbar-acciones">
        <span class="cuota">Mensajes hoy: <span id="contador-cuota">0</span>/30</span>
        <button id="btn-tema" class="icon-btn" aria-label="Cambiar a tema oscuro">
          <svg class="icon" viewBox="0 0 20 20"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></svg>
        </button>
        <button id="btn-panel" class="icon-btn" aria-label="Panel de ingeniería">
          <svg class="icon" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="fila-medio">
      <section class="escenario card" aria-label="Mate">
        <!-- SVG del Mate (sección §6) -->
<svg id="mate" data-state="neutro" viewBox="0 0 240 260" role="img" aria-label="Mate, tu asistente" class="mate-svg">
  <!-- bombilla -->
  <g class="bombilla">
    <line x1="152" y1="18" x2="128" y2="96" stroke="#c9ccc9" stroke-width="9"/>
    <rect x="144" y="10" width="18" height="10" rx="3" fill="#d6d9d8"/>
    <line x1="146" y1="40" x2="141" y2="56" stroke="#a9adab" stroke-width="9"/>
  </g>
  <!-- cuerpo / porongo -->
  <path class="cuerpo" fill="var(--gourd)" d="M64 104 C40 140 38 205 80 232 C105 248 135 248 160 232 C202 205 200 140 176 104 Z"/>
  <path class="sombra" fill="var(--gourd-shade)" opacity=".45" stroke="none" d="M160 112 C186 150 188 205 150 236 C175 214 182 160 160 112 Z"/>
  <!-- virola de alpaca + yerba -->
  <rect x="60" y="88" width="120" height="18" rx="9" fill="var(--metal-alpaca)"/>
  <ellipse cx="120" cy="90" rx="52" ry="8" fill="var(--yerba-fresh)"/>
  <!-- mejillas -->
  <ellipse cx="86" cy="172" rx="10" ry="6" fill="var(--cheek)" opacity=".55" stroke="none"/>
  <ellipse cx="154" cy="172" rx="10" ry="6" fill="var(--cheek)" opacity=".55" stroke="none"/>
  <!-- OJOS: un grupo por estado -->
  <g class="ojos ojos-abiertos">  <circle cx="98" cy="150" r="8" fill="#3a2e24"/><circle cx="142" cy="150" r="8" fill="#3a2e24"/><circle cx="101" cy="147" r="2.5" fill="white"/><circle cx="145" cy="147" r="2.5" fill="white"/></g>
  <g class="ojos ojos-felices" style="display:none;">  <path d="M89 153 Q98 141 107 153"/><path d="M133 153 Q142 141 151 153" stroke="none" stroke-width="4"/></g>
  <!-- CEJAS -->
  <g class="cejas cejas-serio" style="display:none;">  <path d="M86 134 L108 140"/><path d="M154 134 L132 140" stroke-width="4"/></g>
  <!-- BOCAS -->
  <path class="boca boca-neutro"   d="M106 176 Q120 188 134 176" fill="none" stroke-width="4"/>
  <g    class="boca boca-contento" style="display:none;">  <path d="M100 172 Q120 204 140 172 Z"/><ellipse cx="120" cy="188" rx="8" ry="5" fill="#d9776b" stroke="none"/></g>
  <ellipse class="boca boca-hablando" cx="120" cy="181" rx="11" ry="8" fill="var(--mouth)" style="display:none"/>
  <path class="boca boca-serio"    d="M108 182 L132 182" fill="none" stroke-width="4"/>
  <!-- BRAZOS: un grupo por postura -->
  <g class="brazos brazos-saludo">   <path d="M66 170 Q48 182 44 196"/><circle cx="44" cy="198" r="9" fill="var(--gourd)"/><g class="mano-saluda"><path d="M174 164 Q196 150 204 128"/><circle cx="205" cy="123" r="9" fill="var(--gourd)"/></g></g>
  <g class="brazos brazos-arriba">   <path d="M68 160 Q46 140 40 116"/><circle cx="39" cy="111" r="9"/><path d="M172 160 Q194 140 200 116"/><circle cx="201" cy="111" r="9"/></g>
  <g class="brazos brazos-jarra" style="display:none;">   <path d="M66 168 Q44 184 62 204"/><circle cx="64" cy="206" r="9"/><path d="M174 168 Q196 184 178 204"/><circle cx="176" cy="206" r="9"/></g>
</svg>
        <div id="globo" class="globo" aria-live="polite">
          <p id="globo-texto"></p>
          <div id="globo-chips" class="chips"></div>
        </div>
      </section>

      <aside class="agenda card" aria-label="Tu agenda">
        <div class="agenda-head">
          <h2>Tu agenda</h2>
          <button id="btn-ics" class="btn btn-small">Suscribir .ics</button>
        </div>
        <ul id="lista-agenda" class="lista-agenda"></ul>
        <p id="agenda-vacia" class="agenda-vacia" hidden>Nada agendado por ahora.</p>
      </aside>
    </div>

    <section class="tarjetas" aria-label="Accesos rápidos">
      <button class="tarjeta card" data-prompt="Listá qué tengo para hoy, buscame un hueco libre de 1 hora y ayudame a organizar el día">
        <svg class="icon" viewBox="0 0 20 20"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8h14M7 2.5v3M13 2.5v3"/></svg>
        <span>Planificar mi día</span>
      </button>
      <button class="tarjeta card" data-prompt="Agendame un bloque de estudio de Bases de Datos hoy a las 16:00 hs y creá el hábito de estudiar 3 veces por semana">
        <svg class="icon" viewBox="0 0 20 20"><path d="M3 4.5h5a2 2 0 0 1 2 2V16a1.5 1.5 0 0 0-1.5-1.5H3zM17 4.5h-5a2 2 0 0 0-2 2V16a1.5 1.5 0 0 1 1.5-1.5H17z"/></svg>
        <span>Agendar estudio</span>
      </button>
      <button class="tarjeta card" data-prompt="Quiero ir al gym 3 veces por semana a las 19:00 hs y anotar que hoy ya cumplí">
        <svg class="icon" viewBox="0 0 20 20"><path d="M2.5 10h15M5 7v6M15 7v6M3 8.5v3M17 8.5v3"/></svg>
        <span>Registrar mi gym</span>
      </button>
      <button class="tarjeta card" data-prompt="El cumpleaños de mi novia es en 6 días, guardalo en tu memoria y creá un recordatorio">
        <svg class="icon" viewBox="0 0 20 20"><path d="M10 3a4.5 4.5 0 0 0-4.5 4.5c0 4-1.5 5.5-1.5 5.5h12s-1.5-1.5-1.5-5.5A4.5 4.5 0 0 0 10 3zM8.5 16a1.5 1.5 0 0 0 3 0"/></svg>
        <span>Guardar recordatorio</span>
      </button>
    </section>

    <form id="form-chat" class="chatbar card">
      <label for="input-chat" class="sr-only">Mensaje para Mate</label>
      <input type="text" id="input-chat" placeholder="Pedile lo que necesites…" maxlength="1000" autocomplete="off">
      <button id="btn-enviar" class="btn btn-primary" type="submit" aria-label="Enviar">
        <svg class="icon" viewBox="0 0 20 20"><path d="M3 10l14-6-6 14-2-6z"/></svg>
      </button>
    </form>
  </main>

  <dialog id="dialog-panel">
    <h2>Panel de ingeniería</h2>
    <p>Simulá avisos proactivos por SSE.</p>
    <div class="dialog-acciones">
      <button class="btn" data-scenario="gym">Aviso gym</button>
      <button class="btn" data-scenario="estudio">Aviso estudio</button>
      <button class="btn" data-scenario="cumple">Aviso cumple</button>
    </div>
    <form method="dialog"><button class="btn">Cerrar</button></form>
  </dialog>

  <dialog id="dialog-ics">
    <h2>Suscribir agenda .ics</h2>
    <p>Pegá esta dirección en tu app de calendario.</p>
    <code id="ics-url"></code>
    <div class="dialog-acciones">
      <button id="btn-copiar-ics" class="btn">Copiar</button>
      <button id="btn-revocar-ics" class="btn btn-danger">Revocar</button>
    </div>
    <form method="dialog"><button class="btn">Cerrar</button></form>
  </dialog>

  <script src="/static/app.js" defer></script>
</body>
</html>
