name: CI/CD - Mate

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-slim
      volumes:
        - ./src/mate_api:/app/src/mate_api:cached
        - ./requirements.txt:/requirements.txt:cached
        - ./pyproject.toml:/pyproject.toml:cached
    env:
      PYTHONPATH: /app/src
      REDIS_URL: ""
      DAILY_TOKEN_BUDGET: "50000"
      SECRET_KEY: "test-secret-key-not-real"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run tests
        run: |
          pytest -x -q

  codeql:
    runs-on: ubuntu-latest
    permission:
      contents: read
      security-policy: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Do NOT use build-mode: none - we want actual analysis

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  trivy:
    runs-on: ubuntu-latest
    container:
      image: aquasec/trivy:0.26.0
      volumes:
        - ./:/app:ro

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        trivy:
          ignore-unfixed: true
          scanners: ['vuln', 'secret', 'config']
          severity: 'CRITICAL,HIGH'
          output: 'template'
          template: 'json' > trivy-results.json

      - name: Upload Trivy scan results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json

  deploy:
    needs: [test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: |
            ghcr.io/aaaactis/mate:latest
            ghcr.io/aaaactis/mate:${{ github.sha }}